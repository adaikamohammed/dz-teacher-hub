<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="jusoorTitle">
  <title id="jusoorTitle">منصة جسور التعليمية</title>
  <defs>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#097962"/>
      <stop offset="50%" stop-color="#076653"/>
      <stop offset="100%" stop-color="#054b3d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bridgeGrad)"/>

  <!-- Subtle glow / decorative ring -->
  <circle cx="256" cy="245" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Connecting Bridge Arches -->
  <!-- Outer Arch ribbon -->
  <path d="M 120 320 C 130 180, 382 180, 392 320" 
        fill="none" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="32" 
        stroke-linecap="round"/>

  <!-- Inner Vibrant Bridge Path -->
  <path d="M 120 320 C 135 195, 377 195, 392 320" 
        fill="none" 
        stroke="url(#mintGrad)" 
        stroke-width="16" 
        stroke-linecap="round"/>

  <!-- Left Node: Teacher / School (Book) -->
  <g filter="url(#shadow)">
    <circle cx="125" cy="320" r="54" fill="#ffffff"/>
    <circle cx="125" cy="320" r="46" fill="#f0fdf4"/>
    <!-- Book Icon -->
    <path d="M 108 310 Q 125 316 125 332 Q 125 316 142 310 L 142 326 Q 125 331 125 342 Q 125 331 108 326 Z" 
          fill="#076653"/>
  </g>

  <!-- Right Node: Parent / Family (Heart / Home) -->
  <g filter="url(#shadow)">
    <circle cx="387" cy="320" r="54" fill="#ffffff"/>
    <circle cx="387" cy="320" r="46" fill="#f0fdf4"/>
    <!-- Caring Parent / Heart Icon -->
    <path d="M 387 337 C 387 337 369 324 369 313 C 369 306 374 302 380 302 C 384 302 386 304 387 307 C 388 304 390 302 394 302 C 400 302 405 306 405 313 C 405 324 387 337 387 337 Z" 
          fill="#076653"/>
  </g>

  <!-- Central / Top Node: Student / Excellence (Elevated Star) -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="180" r="64" fill="#ffffff"/>
    <circle cx="256" cy="180" r="54" fill="#fffbeb"/>
    <circle cx="256" cy="180" r="50" fill="url(#bridgeGrad)"/>
    <!-- Golden Star of Excellence -->
    <path d="M 256 154 L 263.5 171.5 L 282 172.5 L 267.5 184 L 272.5 202 L 256 191 L 239.5 202 L 244.5 184 L 230 172.5 L 248.5 171.5 Z" 
          fill="url(#goldGrad)"/>
  </g>

  <!-- Arabic Typography at Bottom: جسور -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="'Cairo', 'Tajawal', sans-serif" 
        font-weight="900" 
        font-size="44" 
        fill="#ffffff" 
        letter-spacing="2">
    جُـسُــور
  </text>
  <text x="256" y="475" 
        text-anchor="middle" 
        font-family="'Cairo', 'Tajawal', sans-serif" 
        font-weight="600" 
        font-size="16" 
        fill="#a7f3d0" 
        letter-spacing="1">
    حيث يلتقي الأستاذ، الولي، والتلميذ
  </text>
</svg>
